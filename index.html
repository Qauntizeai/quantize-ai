                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const STORAGE_KEY = 'quantize-ai-saved-v2';

let results = [];
let activeFilter = 'all';
let currentView = 'discover';
let saved = loadSaved();

const cached = new Map();

function loadSaved() {
  try {
    const items = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || '[]'
    );

    return Array.isArray(items)
      ? items.slice(0, 80).filter(
          x => x && typeof x.title === 'string'
        )
      : [];
  } catch {
    return [];
  }
}

function storeSaved() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(saved)
    );
  } catch {
    announce('Your browser cannot save sources right now.');
  }

  updateStats();
}

function updateStats() {
  $('savedCount').textContent = String(saved.length);
  $('navSavedCount').textContent = String(saved.length);
  $('resultCount').textContent =
    String(visibleItems().length);
}

function yearOf(item) {
  const year =
    item.published?.['date-parts']?.[0]?.[0] ||
    item.created?.['date-parts']?.[0]?.[0];

  return Number.isInteger(year)
    ? String(year)
    : 'Date unknown';
}

function flattenAuthors(item) {
  return (item.author || [])
    .slice(0, 5)
    .map(author =>
      [author.given, author.family]
        .filter(Boolean)
        .join(' ')
        .trim()
    )
    .filter(Boolean);
}

function classify(item) {
  const title = (item.title?.[0] || '').toLowerCase();
  const type = (item.type || '').toLowerCase();

  if (
    /review|meta.analysis|systematic review|scoping review|literature review/.test(title) ||
    type === 'book-review'
  ) {
    return 'review';
  }

  if (
    /randomized trial|cohort study|clinical trial|field experiment|cross.sectional study|case.control|original research|survey of|qualitative interview/.test(title) ||
    type === 'dataset'
  ) {
    return 'primary';
  }

  return 'unclear';
}

function safeUrl(item) {
  const raw = item.DOI
    ? 'https://doi.org/' + item.DOI
    : item.URL;

  try {
    const url = new URL(raw);

    return url.protocol === 'https:'
      ? url.href
      : null;
  } catch {
    return null;
  }
}

function cleanItem(work) {
  return {
    DOI: typeof work.DOI === 'string'
      ? work.DOI
      : '',

    title: [
      String(work.title?.[0] || 'Untitled publication')
    ],

    author: Array.isArray(work.author)
      ? work.author.slice(0, 8).map(a => ({
          given: String(a.given || ''),
          family: String(a.family || '')
        }))
      : [],

    published: work.published,
    created: work.created,
    type: String(work.type || ''),
    URL: String(work.URL || ''),

    'container-title': [
      String(
        work['container-title']?.[0] ||
        'Publication record'
      )
    ]
  };
}

function keyFor(work) {
  return work.DOI || work.URL || work.title?.[0] || '';
}

function visibleItems() {
  const items =
    currentView === 'saved' ? saved : results;

  return items.filter(
    item =>
      activeFilter === 'all' ||
      classify(item) === activeFilter
  );
}

function announce(message) {
  const box = document.createElement('div');

  box.className = 'empty';
  box.textContent = message;

  $('results').replaceChildren(box);
}

function element(tag, className, text) {
  const el = document.createElement(tag);

  if (className) {
    el.className = className;
  }

  if (text !== undefined) {
    el.textContent = text;
  }

  return el;
}

function makeAction(label, action, className = '') {
  const button = element(
    'button',
    'action ' + className,
    label
  );

  button.type = 'button';
  button.addEventListener('click', action);

  return button;
}

function makeSource(work) {
  const block = element('article', 'source');
  const top = element('div', 'source-top');

  const category = classify(work);

  const label =
    category === 'primary'
      ? 'Possible primary'
      : category === 'review'
        ? 'Possible review'
        : 'Type unconfirmed';

  const categoryClass =
    category === 'review'
      ? 'review'
      : category === 'unclear'
        ? 'unclear'
        : '';

  top.append(
    element(
      'span',
      'source-type ' + categoryClass,
      label
    )
  );

  top.append(
    element('span', 'source-year', yearOf(work))
  );

  block.append(top);

  block.append(
    element(
      'h3',
      '',
      work.title?.[0] || 'Untitled publication'
    )
  );

  block.append(
    element(
      'p',
      'source-detail',
      (flattenAuthors(work).join(', ') ||
        'Author not listed') +
        ' · ' +
        (work['container-title']?.[0] ||
          'Publication record')
    )
  );

  const actions = element('div', 'source-actions');
  const link = safeUrl(work);

  if (link) {
    const anchor = element(
      'a',
      'action',
      '↗ Open publication'
    );

    anchor.href = link;
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';

    actions.append(anchor);
  }

  const isSaved = saved.some(
    item => keyFor(item) === keyFor(work)
  );

  actions.append(
    makeAction(
      isSaved ? '✓ Saved' : '+ Save source',
      () => {
        if (
          saved.some(
            item => keyFor(item) === keyFor(work)
          )
        ) {
          saved = saved.filter(
            item => keyFor(item) !== keyFor(work)
          );
        } else if (saved.length < 80) {
          saved.unshift(work);
        } else {
          alert(
            'You can save up to 80 sources in this free prototype.'
          );
          return;
        }

        storeSaved();
        render();
      },
      isSaved ? 'saved' : ''
    )
  );

  actions.append(
    makeAction('Copy APA draft', async () => {
      const authors = flattenAuthors(work);

      const names = authors.length
        ? authors.join(', ')
        : 'Author unknown';

      const citation =
        `${names} (${yearOf(work)}). ` +
        `${work.title?.[0] || 'Untitled'}. ` +
        `${work['container-title']?.[0] || ''}. ` +
        `${link || ''}`;

      try {
        await navigator.clipboard.writeText(citation);

        alert(
          'Draft citation copied. Verify and format it before submitting.'
        );
      } catch {
        prompt(
          'Copy this draft citation:',
          citation
        );
      }
    })
  );

  block.append(actions);

  return block;
}

function render() {
  const list = visibleItems();

  $('results').replaceChildren();

  $('filterRow').hidden =
    currentView === 'saved' && saved.length === 0;

  document
    .querySelectorAll('.filter')
    .forEach(button => {
      button.classList.toggle(
        'active',
        button.dataset.filter === activeFilter
      );
    });

  $('resultsTitle').textContent =
    currentView === 'saved'
      ? 'Saved sources'
      : 'Research results';

  $('viewBadge').textContent =
    currentView === 'saved'
      ? saved.length + ' saved locally'
      : results.length
        ? results.length + ' records loaded'
        : 'Search to get started';

  if (!list.length) {
    announce(
      currentView === 'saved'
        ? 'No saved sources yet. Search for publications and use Save source.'
        : results.length
          ? 'No results match this filter. Try All sources.'
          : 'Search for a topic to discover academic publications.'
    );
  } else {
    list.forEach(item => {
      $('results').append(makeSource(item));
    });
  }

  updateStats();
}

function showView(view) {
  currentView = view;
  activeFilter = 'all';

  $('navDiscover').classList.toggle(
    'active',
    view === 'discover'
  );

  $('navSaved').classList.toggle(
    'active',
    view === 'saved'
  );

  render();

  $('resultsTitle').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
}

async function searchResearch(event) {
  if (event) {
    event.preventDefault();
  }

  const term = $('searchInput').value.trim();

  if (!term) {
    return;
  }

  currentView = 'discover';
  activeFilter = 'all';

  $('navDiscover').classList.add('active');
  $('navSaved').classList.remove('active');

  $('searchBtn').disabled = true;
  $('searchBtn').textContent = 'Searching…';

  announce('Searching published research records…');

  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    13000
  );

  try {
    let items = cached.get(term.toLowerCase());

    if (!items) {
      const url =
        'https://api.crossref.org/works?query.bibliographic=' +
        encodeURIComponent(term) +
        '&rows=12';

      const response = await fetch(url, {
        signal: controller.signal,
        headers: {
          Accept: 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error(
          'The research service returned ' +
          response.status
        );
      }

      const data = await response.json();

      items = (data.message?.items || [])
        .map(cleanItem);

      cached.set(term.toLowerCase(), items);
    }

    results = items;
    render();

  } catch (error) {
    results = [];
    render();

    announce(
      error.name === 'AbortError'
        ? 'The search took too long. Please try again.'
        : 'Research search is unavailable right now. Check your connection or try again later.'
    );

  } finally {
    clearTimeout(timeout);

    $('searchBtn').disabled = false;
    $('searchBtn').textContent = 'Search sources →';
  }
}

function coachReply(question) {
  const text = question.toLowerCase();

  if (/hello|^hi\b|hey/.test(text)) {
    return 'Hi! Try asking about primary sources, secondary sources, credibility, citations, or making a research plan.';
  }

  if (/primary/.test(text)) {
    return 'A primary source is original evidence. Examples include original experiments, interviews, survey results, court records, and historical letters.';
  }

  if (/secondary|review/.test(text)) {
    return 'Secondary sources interpret or combine primary evidence. Examples include literature reviews, textbooks, and historical analyses.';
  }

  if (/credib|reliab|trust|peer.review|fake/.test(text)) {
    return 'Credibility checklist: Check the author, publication, research methods, supporting evidence, publication date, conflicts of interest, corrections, and retractions.';
  }

  if (/cite|citation|apa|mla|reference/.test(text)) {
    return 'Record the authors, year, title, publication, DOI or URL, and relevant pages. Use the Copy APA draft button, but verify the citation before submitting it.';
  }

  if (/plan|topic|question|research/.test(text)) {
    return 'Try this research plan:\n1. Write a clear research question.\n2. Identify useful search terms.\n3. Compare original studies and review articles.\n4. Record evidence and limitations.\n5. Cite your sources.';
  }

  if (
    /summar|explain.*(article|paper)|what.*(article|paper)/.test(text)
  ) {
    return 'I cannot read or summarize full articles in this free guide. Open the publication and review its abstract, methods, findings, and limitations.';
  }

  return 'I am a free, rule-based research guide rather than an OpenAI model. I can help with source types, credibility checks, citations, and research planning.';
}

function sendCoach(question) {
  const text = question.trim();

  if (!text) {
    return;
  }

  const messages = $('coachMessages');

  messages.append(
    element('div', 'bubble me', text)
  );

  messages.append(
    element('div', 'bubble bot', coachReply(text))
  );

  messages.scrollTop = messages.scrollHeight;
}

$('coachForm').addEventListener('submit', event => {
  event.preventDefault();

  const question = $('coachInput').value;

  $('coachInput').value = '';

  sendCoach(question);
});

$('searchForm').addEventListener(
  'submit',
  searchResearch
);

document
  .querySelectorAll('[data-topic]')
  .forEach(button => {
    button.addEventListener('click', () => {
      $('searchInput').value = button.dataset.topic;
      searchResearch();
    });
  });

document
  .querySelectorAll('[data-question]')
  .forEach(button => {
    button.addEventListener('click', () => {
      sendCoach(button.dataset.question);
    });
  });

document
  .querySelectorAll('[data-filter]')
  .forEach(button => {
    button.addEventListener('click', () => {
      activeFilter = button.dataset.filter;
      render();
    });
  });

render();
</script>
